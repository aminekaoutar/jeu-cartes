{% extends "blackjack/base.html" %}
{% block title %}Connexion — Blackjack{% endblock %}
{% block content %}
<div class="card stack" style="max-width: 26rem; margin: 0 auto;">
  <h1>Connexion</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="btn btn--primary" type="submit">Se connecter</button>
  </form>
  <p class="text-muted">Pas encore de compte ? <a href="{% url 'blackjack:signup' %}">Inscription</a></p>
</div>
{% endblock %}
