services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blackjack}
      POSTGRES_USER: ${POSTGRES_USER:-blackjack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackjack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackjack} -d ${POSTGRES_DB:-blackjack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blackjack_net

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blackjack_net

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://cache:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - blackjack_net

volumes:
  postgres_data:

networks:
  blackjack_net:
    driver: bridge
